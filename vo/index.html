const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = 'vo.unlock.' + D.salt;
const show = html => { document.open(); document.write(html); document.close(); };
async function unlock(key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, key, b64(D.ct));
  return new TextDecoder().decode(pt);
}
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try {
      const key = await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', true, ['decrypt']);
      return show(await unlock(key));
    } catch (e) { try { localStorage.removeItem(KEY); } catch (e) {} }
  }
  const f = document.getElementById('f');
  f.hidden = false;
  f.onsubmit = async ev => {
    ev.preventDefault();
    document.getElementById('err').textContent = 'Checking...';
    try {
      const key = await derive(document.getElementById('pw').value);
      const html = await unlock(key);
      if (document.getElementById('rem').checked) {
        const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
        try { localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e) {}
      }
      show(html);
    } catch (e) { document.getElementById('err').textContent = 'Wrong password'; }
  };
})();
